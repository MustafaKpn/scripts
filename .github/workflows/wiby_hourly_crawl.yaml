name: Hourly Crawler

on:
  schedule:
    # Not ":00" on purpose: GitHub delays or drops schedules in the congested top-of-hour slot.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so an overlapping manual run cannot break the scheduled push.
concurrency:
  group: wiby-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Always start from the current tip of main, not the commit the run was
          # dispatched on. A queued run would otherwise crawl on a stale database.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Run scraper
        working-directory: wiby
        run: python crawl_wiby.py

      - name: Commit DB
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # wiby.db is a binary SQLite file, so git cannot merge it. Instead of
          # committing and rebasing, keep this run's crawl aside, take whatever is
          # on main right now, and merge the URLs into it at the SQL level.
          cp wiby/wiby.db "$RUNNER_TEMP/crawled.db"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD

            python - <<'PY'
          import os, sqlite3
          db = sqlite3.connect("wiby/wiby.db")
          before = db.execute("SELECT COUNT(*) FROM urls").fetchone()[0]
          db.execute("ATTACH DATABASE ? AS crawled", (os.path.join(os.environ["RUNNER_TEMP"], "crawled.db"),))
          db.execute("INSERT OR IGNORE INTO urls(url) SELECT url FROM crawled.urls")
          db.commit()
          after = db.execute("SELECT COUNT(*) FROM urls").fetchone()[0]
          print(f"Merged crawl into main's database: {before} -> {after} urls (+{after - before})")
          PY

            git add wiby/wiby.db
            if git diff --staged --quiet; then
              echo "No database changes."
              exit 0
            fi

            git commit -m "Update wiby.db $(date -u '+%Y-%m-%d')"

            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (main moved during attempt $attempt); retrying on the new tip."
          done

          echo "Could not push after 3 attempts."
          exit 1
