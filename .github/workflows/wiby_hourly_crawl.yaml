name: Hourly Crawler

on:
  schedule:
    # Not ":00" on purpose: GitHub delays or drops schedules in the congested top-of-hour slot.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so an overlapping manual run cannot break the scheduled push.
concurrency:
  group: wiby-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Run scraper
        working-directory: wiby
        run: python crawl_wiby.py

      - name: Commit DB
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add wiby/wiby.db

          if git diff --staged --quiet; then
            echo "No database changes."
            exit 0
          fi

          git commit -m "Update wiby.db $(date -u '+%Y-%m-%d')"

          git pull --rebase origin main
          git push origin main
