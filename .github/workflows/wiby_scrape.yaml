name: Daily Scraper

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run scraper
        working-directory: wiby
        run: python curl_wiby.py

      - name: Commit DB
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add wiby/wiby.db
          git diff --staged --quiet || git commit -m "Update wiby.db $(date -u '+%Y-%m-%d')"
          git push
